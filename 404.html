<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Уроки Figma</title>
  <style>
    :root{--violet:#5b35d5;--violet2:#8a68ff;--deep:#20144b;--paper:#fbfaff;--lilac:#f0ecff;--ink:#211b38;--muted:#6c6680;--line:#ded6fb;--mint:#52d6bb;--yellow:#ffd45b;--shadow:0 18px 48px rgba(55,30,136,.14)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 84% 17%,rgba(138,104,255,.24),transparent 22%),radial-gradient(circle at 15% 85%,rgba(82,214,187,.18),transparent 23%),linear-gradient(145deg,var(--paper),#f5f0ff)}
    main{display:grid;min-height:100vh;place-items:center;padding:28px 18px;overflow:hidden}.card{position:relative;width:min(690px,100%);padding:clamp(34px,7vw,70px);text-align:center;overflow:hidden;border:1px solid #fff;border-radius:34px;background:rgba(255,255,255,.86);box-shadow:var(--shadow)}.card:before,.card:after{position:absolute;z-index:-1;content:"";border-radius:50%}.card:before{width:190px;height:190px;top:-95px;right:-60px;border:28px solid var(--yellow);opacity:.42}.card:after{width:135px;height:135px;bottom:-60px;left:-48px;background:var(--mint);opacity:.28}
    .mark{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 25px;border-radius:22px;background:linear-gradient(135deg,var(--violet2),var(--violet));box-shadow:0 12px 22px rgba(91,53,213,.28)}.mark span{display:block;width:26px;height:26px;border-radius:10px 2px 10px 2px;background:#fff;box-shadow:10px 10px 0 -5px rgba(255,255,255,.75)}.eyebrow{margin:0 0 7px;color:var(--violet);font-size:13px;font-weight:950;letter-spacing:.12em}h1{margin:0;color:var(--deep);font-size:clamp(96px,20vw,176px);line-height:.78;letter-spacing:-.1em}h2{margin:29px auto 11px;max-width:500px;font-size:clamp(27px,4vw,42px);line-height:1.05;letter-spacing:-.045em}.lead{max-width:470px;margin:0 auto;color:var(--muted);font-size:18px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:31px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:13px 20px;border:2px solid transparent;border-radius:15px;font-weight:900;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}.button:hover{transform:translateY(-3px)}.primary{color:#fff;background:var(--violet);box-shadow:0 9px 17px rgba(91,53,213,.24)}.secondary{border-color:var(--line);background:#fff;color:var(--violet)}.secondary:hover{box-shadow:0 9px 17px rgba(55,30,136,.1)}@media(max-width:490px){.card{border-radius:27px}.actions{flex-direction:column}.button{width:100%}.lead{font-size:16px}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true"><span></span></div>
      <p class="eyebrow">FIGMA · YOUR LEVEL UP</p>
      <h1 id="page-title">404</h1>
      <h2>Кажется, этот фрейм уехал за холст</h2>
      <p class="lead">Вернёмся к урокам или напишем Виктории — она поможет найти нужный маршрут.</p>
      <div class="actions">
        <a class="button primary" href="https://figma.yourlevelup.ru/">К урокам Figma</a>
        <a class="button secondary" href="https://vk.ru/mankovav" target="_blank" rel="noopener">Контакты Виктории ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
